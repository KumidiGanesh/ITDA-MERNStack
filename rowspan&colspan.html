<!DOCTYPE html>

    <title>HTML TABLE</title>

<body>
    <h1>Rowspan Examples (Complex)</h1>
<table border="1">

        <td rowspan="2">S.No</td>

        <td>1st year</td>
        <td>2nd year</td>
        <td>3rd year</td>
     </tr>
     <tr>

        <td>C Programming</td>
        <td></td>
        <td>*</td>
        <td></td>
        <td></td>
    </tr>

        <td>Data Structure</td>
        <td></td>
        <td>*</td>
        <td></td>
        <td></td>
    </tr>
     <tr>
        <td rowspan="3">2</td>
        <td rowspan="3">Electronics</td>
        <td>Digital Electronics</td>
        <td>*</td>
        <td></td>
        <td></td>
        <td></td>
    </tr>
     <tr>
        <td>Microprocessors</td>
        <td></td>
        <td>*</td>
        <td></td>
        <td></td>
    </tr>
     <tr>
        
        <td>Comminication Systems</td>
        <td></td>
        <td>*</td>
        <td></td>
        <td></td>
    </tr>
     <tr>
        <td rowspan="2">3</td>
        <td rowspan="2">Mechanical</td>
        <td>Engineering Mechanics</td>
        <td>*</td>
        <td></td>
        <td></td>
        <td></td>
    </tr>
     <tr>
        <td>Thermodynamics</td>
        <td></td>
        <td>*</td>
        <td></td>
        <td></td>
    </tr>
</table>
</body>
</html>
